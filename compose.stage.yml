services:
  proxy:
    container_name: yosrbenattia-reverse-proxy
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - 3060:3060
    volumes:
      - ./Caddyfile.stage:/etc/caddy/Caddyfile
      - ./data:/data
      - ./config:/config
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        NODE_ENV: stage

    environment:
      NODE_ENV: stage
      contactUsKey: ${contactUsKey}
      RECIPIENT: ${RECIPIENT}

    restart: unless-stopped

volumes:
  data:
  config: